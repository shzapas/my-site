    <script>
        // ============================================================
        // ==================== ОСНОВНАЯ ЛОГИКА ====================
        // ============================================================

        // ---- Переменные ----
        let fullData = [];
        let filteredData = [];
        let gammaData = [];
        let reservyData = [];
        let gammaRawData = [];

        let tsSelectedStores = new Set();
        let isDark = false;

        // Кеш резервов
        const reservyMap = new Map();

        const reportFilePatterns = {
            "Гамма": ["гамма", "gamma"],
            "Резервы": ["резервы", "резерв"]
        };

        const reportNames = Object.keys(reportFilePatterns);
        let loadedReports = {};
        reportNames.forEach(n => loadedReports[n] = false);

        // ---- Toast ----
        function showToast(msg, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${msg}</span><span class="toast-close">✕</span>`;
            container.appendChild(toast);
            toast.querySelector('.toast-close').onclick = () => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            };
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }
            }, duration);
        }

        // ---- Help ----
        function toggleHelp() {
            document.getElementById('helpModal').classList.toggle('show');
        }

        function closeHelp() {
            document.getElementById('helpModal').classList.remove('show');
        }

        // ---- Theme ----
        function toggleTheme() {
            isDark = !isDark;
            document.body.style.background = isDark ? '#1a2a1a' : '#f0f7f0';
            document.body.style.color = isDark ? '#e0e8e0' : '#1e2e1e';
            document.querySelectorAll('.left-panel, .right-panel').forEach(el => {
                el.style.background = isDark ? '#1e2e1e' : 'white';
                el.style.borderColor = isDark ? '#2d4a2d' : '#c8e6c9';
            });
            document.querySelectorAll('.stat-card, .upload-status, .auto-load-result-container, .auto-load-result-header')
                .forEach(el => {
                    el.style.background = isDark ? '#1e2e1e' : '';
                    el.style.borderColor = isDark ? '#2d4a2d' : '';
                });
            document.querySelectorAll('.filter-group select, .filter-group input').forEach(el => {
                el.style.background = isDark ? '#1e2e1e' : '#fafffa';
                el.style.color = isDark ? '#e0e8e0' : '#1e2e1e';
                el.style.borderColor = isDark ? '#2d4a2d' : '#a5d6a7';
            });
            showToast(isDark ? '🌙 Тёмная тема' : '☀️ Светлая тема', 'info');
        }

        // ---- Utils ----
        function toNumber(v, def = 0) {
            if (v === undefined || v === null || v === '') return def;
            if (typeof v === 'number') return isNaN(v) ? def : v;
            const s = String(v).replace(/,/g, '.').replace(/\s/g, '').replace(/[^0-9.\-]/g, '');
            const n = Number(s);
            return isNaN(n) ? def : n;
        }

        function round(v, d = 1) {
            const n = toNumber(v);
            const f = Math.pow(10, d);
            return Math.round(n * f) / f;
        }

        function extractStore(s) {
            if (!s) return '';
            const m = String(s).match(/^(\d+)/);
            return m ? String(parseInt(m[1], 10)) : String(s).trim();
        }

        function getStoreValue(item, keys = []) {
            for (const k of keys) {
                if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== '') {
                    return extractStore(item[k]);
                }
            }
            for (const k of Object.keys(item)) {
                if (k.includes('Магазин') || k.includes('Store')) {
                    const v = String(item[k]).trim();
                    if (v) return extractStore(v);
                }
            }
            return '';
        }

        function getSumByReserve(store, art, type) {
            const key = `${store}|${art}`;
            const items = reservyMap.get(key);
            if (!items) return 0;
            let sum = 0;
            for (const item of items) {
                if (item['Резерв'] === type) sum += toNumber(item['Кол-во резерва']);
            }
            return sum;
        }

        function getMaxReserve(store, art) {
            const key = `${store}|${art}`;
            const items = reservyMap.get(key);
            if (!items) return 0;
            let max = 0;
            for (const item of items) {
                const r = String(item['Резерв'] || '').toLowerCase();
                if (r.includes('мин') || r.includes('дн')) {
                    const v = toNumber(item['Кол-во резерва']);
                    if (v > max) max = v;
                }
            }
            return max;
        }

        function cleanZero(v, col) {
            const zeroCols = ['max дн.', 'Авто min', 'min ЦО Проект', 'min ЦО ПАК-Подиум', 'min ЦО коорд',
                'min 401 NEW', 'min 441 ПМ', 'min 500 Проект', 'min 902 B2B', 'max шт.', 'Брак',
                'ЭКСПО', 'През. минимум', 'ТЖ/ПАК', 'Подиум магазина', 'Улич. Торг', 'Доп. презентация'
            ];
            const n = toNumber(v, 0);
            if (zeroCols.includes(col) && n === 0) return '';
            return n;
        }

        function getFieldValue(item, keys) {
            for (const k of keys) {
                if (item[k] !== undefined && item[k] !== null && item[k] !== '') return item[k];
            }
            return '';
        }

        // ---- Build Maps (только резервы) ----
        function buildMaps() {
            reservyMap.clear();
            for (const item of reservyData) {
                const store = getStoreValue(item, ['Магазин', '№ магазина']);
                const art = String(item['Артикул'] || '').trim();
                if (store && art) {
                    const key = `${store}|${art}`;
                    if (!reservyMap.has(key)) reservyMap.set(key, []);
                    reservyMap.get(key).push(item);
                }
            }
            console.log('✅ Кеш резервов построен:', reservyMap.size, 'записей');
        }

        // ---- Calculate Row ----
        function calculateRow(gammaItem) {
            const art = String(gammaItem['Артикул'] || '').trim();
            const store = String(gammaItem['№ магазина'] || '').trim();
            if (!art) return null;
            const key = `${store}|${art}`;

            const bestGamma = (toNumber(gammaItem['Сумма Best Seller']) + toNumber(gammaItem['Сумма Мертвый сток']) >= 1) ? 1 : '';

            // ТОП — берём из "Сумма Топ в магазине"
            let top = getFieldValue(gammaItem, ['Сумма Топ в магазине', 'Топ в магазине', 'ТОП', 'Top', 'топ']);
            if (top !== undefined && top !== null && top !== '') {
                const ts = String(top).trim();
                if (ts.match(/^\d+\.00$/)) top = ts.replace(/\.00$/, '');
            } else {
                top = '';
            }

            // Продажная цена — "Сумма Продажная цена магазина"
            const salePrice = toNumber(
                gammaItem['Сумма Продажная цена магазина'] ||
                gammaItem['Продажная цена магазина'] ||
                gammaItem['Цена магазина'] || 0
            );

            // MIN-данные из резервов
            const minDn = getMaxReserve(store, art);

            const minTsProekt = getSumByReserve(store, art, 'Мин ЦО Амбиция проекта шт');
            const minTsPak = getSumByReserve(store, art, 'Мин ЦО Пак-Подиум шт');
            const minTsKoord = getSumByReserve(store, art, 'Мин ЦО коорд. шт');
            const min401 = getSumByReserve(store, art, 'Мин Новый товар шт');
            const min441 = getSumByReserve(store, art, 'Мин Магазин ПМ шт');
            const min500 = getSumByReserve(store, art, 'Мин Магазин Амбиция проекта шт');
            const min902 = getSumByReserve(store, art, 'Мин Магазин В2В шт');

            const brak = getSumByReserve(store, art, 'Брак');
            const ekspo = getSumByReserve(store, art, 'ЭКСПО');
            const prezMin = getSumByReserve(store, art, 'През. минимум');
            const tjPak = getSumByReserve(store, art, 'ТЖ/ПАК');
            const podium = getSumByReserve(store, art, 'Подиум магазина');
            const ulichn = getSumByReserve(store, art, 'Уличн. торговля');
            const dopPrez = getSumByReserve(store, art, 'Резерв F');

            // Наибольший MIN
            const minTypes = {
                'min ЦО Проект': toNumber(minTsProekt),
                'min ЦО ПАК-Подиум': toNumber(minTsPak),
                'min ЦО коорд': toNumber(minTsKoord),
                'min 401 NEW': toNumber(min401),
                'min 441 ПМ': toNumber(min441),
                'min 500 Проект': toNumber(min500),
                'min 902 B2B': toNumber(min902)
            };

            let maxMinVal = 0,
                maxMinType = '';
            for (const [t, v] of Object.entries(minTypes)) {
                if (v > maxMinVal) {
                    maxMinVal = v;
                    maxMinType = t;
                }
            }

            const typeNames = {
                'min ЦО Проект': 'min ЦО Проект',
                'min ЦО ПАК-Подиум': 'min ЦО ПАК-Подиум',
                'min ЦО коорд': 'min ЦО коорд',
                'min 401 NEW': '401 NEW',
                'min 441 ПМ': '441 ПМ',
                'min 500 Проект': '500 Проект',
                'min 902 B2B': '902 B2B'
            };
            const naibolshiyMin = maxMinVal > 0 ? `${typeNames[maxMinType] || maxMinType} (${maxMinVal})` : '';

            const teorStok = toNumber(gammaItem['Сумма Кол-во в запасе']);
            const otgruzheno = toNumber(gammaItem['Отгруженное кол-во']);
            const otgruzhenoSred = otgruzheno > 0 ? round(otgruzheno / 6, 1) : 0;

            let zapasSht = teorStok - ekspo - brak;
            if (zapasSht < 0) zapasSht = 0;

            let zapasDn = 0;
            if (otgruzhenoSred > 0 && zapasSht > 0) {
                zapasDn = round(zapasSht / otgruzhenoSred * 7, 1);
                if (zapasDn < 0) zapasDn = 0;
            } else if (zapasSht > 0 && otgruzhenoSred === 0) {
                zapasDn = 999;
            }

            const vPutishSht = toNumber(gammaItem['Сумма В пути, шт.']);
            let vPutishDn = 0;
            if (vPutishSht > 0 && otgruzhenoSred > 0) {
                vPutishDn = round(vPutishSht / otgruzhenoSred * 7, 1);
                if (vPutishDn < 0) vPutishDn = 0;
            } else if (vPutishSht > 0 && otgruzhenoSred === 0) {
                vPutishDn = 999;
            }

            const vmesimost = toNumber(gammaItem['Вместимость полки']);
            const zapasBolsheVmes = (zapasSht >= vmesimost && vmesimost > 0) ? 'да' : 'нет';

            const supplierCode = String(gammaItem['Номер поставщика'] || gammaItem['№ Поставщика'] || '').trim();

            let percentZapasa = 0;
            if (vmesimost > 0 && zapasSht > 0) {
                percentZapasa = Math.min(round((zapasSht / vmesimost) * 100, 0), 100);
            }

            return {
                '№ магазина': store,
                'Артикул': art,
                'Наименование': gammaItem['Наименование'] || '',
                'BEST гамма': bestGamma,
                'BEST NEXT': '',
                'Гамма': String(gammaItem['Гамма'] || '').trim(),
                'ТОП': top,
                'LOC': gammaItem['Признак LOC'] || '',
                'Статус': gammaItem['Статус'] || '',
                'CPQ': gammaItem['CPQ'] || '',
                'min дн': cleanZero(minDn, 'min дн'),
                'max дн.': '',
                'Авто min': '',
                'min ЦО Проект': cleanZero(minTsProekt, 'min ЦО Проект'),
                'min ЦО ПАК-Подиум': cleanZero(minTsPak, 'min ЦО ПАК-Подиум'),
                'min ЦО коорд': cleanZero(minTsKoord, 'min ЦО коорд'),
                'min 401 NEW': cleanZero(min401, 'min 401 NEW'),
                'min 441 ПМ': cleanZero(min441, 'min 441 ПМ'),
                'min 500 Проект': cleanZero(min500, 'min 500 Проект'),
                'min 902 B2B': cleanZero(min902, 'min 902 B2B'),
                'max шт.': '',
                'Брак': cleanZero(brak, 'Брак'),
                'ЭКСПО': cleanZero(ekspo, 'ЭКСПО'),
                'През. минимум': cleanZero(prezMin, 'През. минимум'),
                'ТЖ/ПАК': cleanZero(tjPak, 'ТЖ/ПАК'),
                'Подиум магазина': cleanZero(podium, 'Подиум магазина'),
                'Улич. Торг': cleanZero(ulichn, 'Улич. Торг'),
                'Доп. презентация': cleanZero(dopPrez, 'Доп. презентация'),
                'Наибольший резерв MIN': naibolshiyMin,
                'Вид минимума': '',
                'Кол-во проектов': '',
                'Вместимость': cleanZero(vmesimost, 'Вместимость'),
                'Наполненность полки': percentZapasa,
                'Отгружено в сред. За 7 дн': cleanZero(otgruzhenoSred, 'Отгружено в сред. За 7 дн'),
                'Теор сток ГАММА': cleanZero(teorStok, 'Теор сток ГАММА'),
                'Запас, шт.': cleanZero(zapasSht, 'Запас, шт.'),
                'Запас, дн.': zapasDn === 999 ? 999 : cleanZero(zapasDn, 'Запас, дн.'),
                'В пути, шт.': cleanZero(vPutishSht, 'В пути, шт.'),
                'В пути, дн.': vPutishDn === 999 ? 999 : cleanZero(vPutishDn, 'В пути, дн.'),
                'Размер упаковки': gammaItem['Размер упаковки'] || '',
                'УТО, руб.': '',
                'УТО, шт.': '',
                'Кол-во случаев перебоя за 30 дн': '',
                'Кол-во дней в перебое': '',
                '20/80': gammaItem['Сумма 20/80'] || '',
                'ТС': gammaItem['Токсичный сток'] || '',
                'МС': gammaItem['Сумма Мертвый сток'] || '',
                'Корекции': '',
                'Недопоставки': '',
                'Подотдел': gammaItem['Подотдел'] || '',
                'ТИП': String(gammaItem['Тип'] || '').trim(),
                'Дни выхода заказа поставщика': '',
                'Номер поставщика': supplierCode,
                'Поставщик': gammaItem['Имя поставщика'] || '',
                'Запас больше вместимости': zapasBolsheVmes,
                'Дата AVS': '',
                'Штрихкод': String(gammaItem['Штрихкод'] || gammaItem['Штрих-код'] || '').trim(),
                'Продажная цена магазина': salePrice
            };
        }

        // ---- Compute ----
        async function computeSummary() {
            if (!gammaData.length) {
                showToast('⚠️ Сначала загрузите файл "Гамма"', 'warning');
                return;
            }

            buildMaps();

            const results = [];
            for (const item of gammaData) {
                const row = calculateRow(item);
                if (row) results.push(row);
            }

            fullData = results;
            filteredData = [...results];

            updateFilters();
            applyFilters();
            buildTsStoreFilter();
            buildTsData();

            showToast(`✅ Расчёт завершён! Найдено ${fullData.length} товаров`, 'success');
        }

        // ---- Update Filters ----
        function updateFilters() {
            const stores = new Set(),
                subdepts = new Set();
            for (const row of fullData) {
                if (row['№ магазина']) stores.add(String(row['№ магазина']));
                if (row['Подотдел']) subdepts.add(String(row['Подотдел']));
            }

            const storeSel = document.getElementById('storeFilter');
            storeSel.innerHTML = '<option value="all">Все магазины</option>';
            Array.from(stores).sort((a, b) => parseInt(a) - parseInt(b)).forEach(s => {
                storeSel.innerHTML += `<option value="${s}">${s}</option>`;
            });

            const subSel = document.getElementById('subdepartmentFilter');
            subSel.innerHTML = '<option value="all">Все подотделы</option>';
            Array.from(subdepts).sort().forEach(s => {
                subSel.innerHTML += `<option value="${s}">${s}</option>`;
            });
        }

        // ---- Apply Filters ----
        function applyFilters() {
            const store = document.getElementById('storeFilter').value;
            const subdept = document.getElementById('subdepartmentFilter').value;
            const top = document.getElementById('topFilter').value;
            const range = document.getElementById('stockRange').value.trim();
            let minD = 0,
                maxD = 999;
            if (range.includes('-')) {
                const parts = range.split('-');
                minD = parseInt(parts[0]) || 0;
                maxD = parseInt(parts[1]) || 999;
            } else if (range) {
                minD = parseInt(range) || 0;
                maxD = parseInt(range) || 999;
            }
            if (minD > maxD)[minD, maxD] = [maxD, minD];

            let data = [...fullData];

            if (store !== 'all') {
                data = data.filter(r => String(r['№ магазина'] || '') === store);
            }
            if (subdept !== 'all') {
                data = data.filter(r => String(r['Подотдел'] || '') === subdept);
            }
            if (top !== 'all') {
                data = data.filter(r => {
                    const t = String(r['ТОП'] || '').replace(/\.00$/, '');
                    return t === top;
                });
            }
            data = data.filter(r => {
                const d = toNumber(r['Запас, дн.'], 999);
                return d >= minD && d <= maxD;
            });

            filteredData = data;
            buildTsData();
        }

        // ---- Reset Filters ----
        function resetFilters() {
            document.getElementById('storeFilter').value = 'all';
            document.getElementById('subdepartmentFilter').value = 'all';
            document.getElementById('topFilter').value = 'all';
            document.getElementById('stockRange').value = '0-999';
            applyFilters();
            showToast('🔄 Фильтры сброшены', 'info');
        }

        // ---- Open MagPortal ----
        function openMagPortal(article) {
            if (!article) return;
            const clean = String(article).replace(/[^\d]/g, '');
            if (clean.length < 4) {
                showToast('❌ Некорректный артикул', 'warning');
                return;
            }
            window.open(`https://magportal.lemanapro.ru/catalogproducts/product/${clean}`, '_blank');
            showToast(`🔗 Открываем ${clean} в MagPortal`, 'info', 1500);
        }

        // ---- Toggle AutoLoad Result ----
        function toggleAutoLoadResult() {
            const resultDiv = document.getElementById('autoLoadResult');
            const icon = document.querySelector('.auto-load-result-header .toggle-icon');
            if (resultDiv) {
                resultDiv.classList.toggle('collapsed');
                if (icon) icon.classList.toggle('rotated');
            }
        }

        // ============================================================
        // ==================== ТС ЛОГИКА ====================
        // ============================================================

        let tsData = {
            items: [],
            byStore: {},
            byArticle: {},
            topArticles: [],
            stores: [],
            transferCandidates: [],
            crossTransfer: []
        };

        function buildTsStoreFilter() {
            const container = document.getElementById('tsStoreFilter');
            if (!container) return;

            const stores = new Set();
            for (const row of fullData) {
                if (row['№ магазина']) stores.add(String(row['№ магазина']));
            }

            container.innerHTML = '';
            const sorted = Array.from(stores).sort((a, b) => parseInt(a) - parseInt(b));

            const allLabel = document.createElement('label');
            const allCb = document.createElement('input');
            allCb.type = 'checkbox';
            allCb.id = 'tsStoreAll';
            allCb.checked = tsSelectedStores.size === 0;
            allCb.onchange = function() {
                if (this.checked) {
                    tsSelectedStores.clear();
                    document.querySelectorAll('.ts-store-cb').forEach(cb => cb.checked = false);
                }
            };
            allLabel.appendChild(allCb);
            allLabel.appendChild(document.createTextNode(' Все'));
            container.appendChild(allLabel);

            for (const s of sorted) {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'ts-store-cb';
                cb.value = s;
                cb.checked = tsSelectedStores.has(s);
                cb.onchange = function() {
                    if (this.checked) {
                        tsSelectedStores.add(s);
                        document.getElementById('tsStoreAll').checked = false;
                    } else {
                        tsSelectedStores.delete(s);
                        if (tsSelectedStores.size === 0) {
                            document.getElementById('tsStoreAll').checked = true;
                        }
                    }
                };
                label.appendChild(cb);
                label.appendChild(document.createTextNode(` ${s}`));
                if (cb.checked) label.classList.add('active');
                container.appendChild(label);
            }
        }

        function applyTsFilter() {
            buildTsData();
            showToast('✅ Фильтр магазинов применён', 'info');
        }

        function resetTsFilter() {
            tsSelectedStores.clear();
            document.getElementById('tsStoreAll').checked = true;
            document.querySelectorAll('.ts-store-cb').forEach(cb => cb.checked = false);
            buildTsData();
            showToast('🗑️ Фильтр магазинов сброшен', 'info');
        }

        function buildTsData() {
            const data = filteredData.length ? filteredData : fullData;
            if (!data.length) {
                tsData = { items: [], byStore: {}, byArticle: {}, topArticles: [], stores: [], transferCandidates: [],
                    crossTransfer: [] };
                renderTsTable();
                return;
            }

            let tsItems = data.filter(row => toNumber(row['ТС'], 0) === 1);

            if (tsSelectedStores.size > 0) {
                tsItems = tsItems.filter(row => tsSelectedStores.has(String(row['№ магазина'] || '')));
            }

            if (!tsItems.length) {
                tsData = { items: [], byStore: {}, byArticle: {}, topArticles: [], stores: [], transferCandidates: [],
                    crossTransfer: [] };
                renderTsTable();
                return;
            }

            const byStore = {};
            const byArticle = {};

            for (const row of tsItems) {
                const store = row['№ магазина'] || 'unknown';
                const art = row['Артикул'] || 'unknown';
                const name = row['Наименование'] || '';
                const days = toNumber(row['Запас, дн.'], 999);
                const transit = toNumber(row['В пути, дн.'], 0);
                const top = row['ТОП'] || '';
                const utoRub = toNumber(row['УТО, руб.'], 0);
                const utoSht = toNumber(row['УТО, шт.'], 0);
                const hasUto = utoRub > 0 || utoSht > 0;
                const zapasSht = toNumber(row['Запас, шт.'], 0);
                const min441 = toNumber(row['min 441 ПМ'], 0);
                const min500 = toNumber(row['min 500 Проект'], 0);
                const min401 = toNumber(row['min 401 NEW'], 0);
                const naibMin = row['Наибольший резерв MIN'] || '';
                const salePrice = toNumber(row['Продажная цена магазина'], 0);
                const otgruzhenoSred = toNumber(row['Отгружено в сред. За 7 дн'], 0);

                if (!byStore[store]) {
                    byStore[store] = { items: [], total: 0, articles: new Set() };
                }
                byStore[store].items.push(row);
                byStore[store].total++;
                byStore[store].articles.add(art);

                if (!byArticle[art]) {
                    byArticle[art] = {
                        name: name,
                        stores: new Set(),
                        total: 0,
                        hasUto: false,
                        utoStores: new Set(),
                        tsStores: new Set(),
                        storeDetails: {},
                        min441: 0,
                        min500: 0,
                        min401: 0,
                        naibMin: '',
                        salePrice: 0,
                        avgSales: 0
                    };
                }

                const aData = byArticle[art];
                aData.stores.add(store);
                aData.total++;
                aData.tsStores.add(store);
                if (hasUto) {
                    aData.hasUto = true;
                    aData.utoStores.add(store);
                }
                if (min441 > 0) aData.min441 = min441;
                if (min500 > 0) aData.min500 = min500;
                if (min401 > 0) aData.min401 = min401;
                if (naibMin) aData.naibMin = naibMin;
                if (salePrice > 0) aData.salePrice = salePrice;
                aData.avgSales += otgruzhenoSred;

                aData.storeDetails[store] = {
                    days,
                    transit,
                    zapasSht,
                    utoRub,
                    utoSht,
                    hasUto,
                    top,
                    min441,
                    min500,
                    min401,
                    naibMin,
                    salePrice,
                    otgruzhenoSred
                };
            }

            // Средние продажи
            for (const [art, data] of Object.entries(byArticle)) {
                data.avgSales = data.stores.size > 0 ? round(data.avgSales / data.stores.size, 1) : 0;
            }

            const topArticles = Object.entries(byArticle)
                .map(([art, data]) => ({
                    article: art,
                    name: data.name,
                    storeCount: data.stores.size,
                    total: data.total,
                    stores: Array.from(data.stores),
                    naibMin: data.naibMin,
                    min441: data.min441,
                    min500: data.min500,
                    min401: data.min401,
                    storeDetails: data.storeDetails,
                    hasUto: data.hasUto,
                    utoStores: Array.from(data.utoStores),
                    salePrice: data.salePrice,
                    avgSales: data.avgSales,
                    avgDays: Object.values(data.storeDetails).reduce((s, d) => s + d.days, 0) / data.stores.size
                }))
                .sort((a, b) => b.storeCount - a.storeCount || b.total - a.total)
                .slice(0, 10);

            // Трансфер: ТС в одних магазинах, УТО в других
            const transferCandidates = Object.entries(byArticle)
                .map(([art, data]) => ({
                    article: art,
                    name: data.name,
                    tsStores: Array.from(data.tsStores),
                    utoStores: Array.from(data.utoStores),
                    total: data.total,
                    hasUto: data.hasUto,
                    avgSales: data.avgSales,
                    storeDetails: data.storeDetails
                }))
                .filter(item => item.tsStores.length > 0 && item.utoStores.length > 0)
                .sort((a, b) => b.utoStores.length - a.utoStores.length || b.tsStores.length - a.tsStores.length)
                .slice(0, 10);

            // Кросс-трансфер: ТС в одном магазине, НЕТ ТС в другом (где есть продажи)
            const crossTransfer = [];
            const allArticles = Object.keys(byArticle);

            for (const art of allArticles) {
                const data = byArticle[art];
                const tsStores = Array.from(data.tsStores);
                const allStores = Array.from(data.stores);

                const noTsStores = allStores.filter(s => !tsStores.includes(s));

                for (const tsStore of tsStores) {
                    for (const noTsStore of noTsStores) {
                        const tsDetails = data.storeDetails[tsStore] || {};
                        const noTsDetails = data.storeDetails[noTsStore] || {};
                        if (noTsDetails.otgruzhenoSred > 0) {
                            crossTransfer.push({
                                article: art,
                                name: data.name,
                                tsStore: tsStore,
                                noTsStore: noTsStore,
                                tsSales: tsDetails.otgruzhenoSred || 0,
                                noTsSales: noTsDetails.otgruzhenoSred || 0,
                                tsDays: tsDetails.days || 0,
                                noTsDays: noTsDetails.days || 0,
                                tsZapas: tsDetails.zapasSht || 0,
                                noTsZapas: noTsDetails.zapasSht || 0,
                                avgSales: data.avgSales
                            });
                        }
                    }
                }
            }

            crossTransfer.sort((a, b) => (b.noTsSales - b.tsSales) - (a.noTsSales - a.tsSales));
            tsData.crossTransfer = crossTransfer.slice(0, 10);

            tsData = {
                items: tsItems,
                byStore,
                byArticle,
                topArticles,
                stores: Object.keys(byStore),
                transferCandidates,
                crossTransfer: tsData.crossTransfer || []
            };

            renderTsTable();
        }

                th.style.background = '#2e7d32';

            });
            thead.appendChild(hRow1);

            const hRow2 = document.createElement('tr');
            baseCols.forEach(c => {
                const th = document.createElement('th');
                th.textContent = c;
                th.style.position = 'sticky';
                th.style.left = '0';
                th.style.zIndex = '11';
                th.style.background = '#388e3c';
                hRow2.appendChild(th);
            });
            stores.forEach(() => {

                    const th = document.createElement('th');

                    th.style.background = '#388e3c';

            tbody.innerHTML = '';

            for (const art of displayArts) {
                const tr = document.createElement('tr');
                const data = tsData.byArticle[art];

                const tdArt = document.createElement('td');
                tdArt.style.position = 'sticky';

                        details.top || '-',
                        details.zapasSht || 0,
                        isTs ? 1 : 0,
                        details.days || 0,
                        details.transit || 0
                    ];
                    for (let i = 0; i < vals.length; i++) {

                header.push(`ТОП ${s}`, `Запас(шт) ${s}`, `ТС ${s}`, `Запас(дн) ${s}`, `В пути(дн) ${s}`);
            }

            const wsData = [header];
            for (const art of articles) {
                const data = tsData.byArticle[art];
                const row = [art, data.name || ''];
                for (const s of stores) {
                    const d = data.storeDetails[s] || {};
                    const isTs = data.tsStores?.has(s) || false;
                    row.push(d.top || '-', d.zapasSht || 0, isTs ? 1 : 0, d.days || 0, d.transit || 0);
                }
                wsData.push(row);
            }

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Сводная_ТС');
            const today = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `Сводная_ТС_${today}.xlsx`);
            showToast('✅ Сводная таблица выгружена', 'success');
        }

        // ==================== ЗАГРУЗКА ФАЙЛОВ ====================

        function selectFolder() {
            const input = document.createElement('input');
            input.type = 'file';
            input.webkitdirectory = true;
            input.directory = true;
            input.multiple = true;
            input.onchange = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                const first = files[0];
                const path = first.webkitRelativePath.split('/');
                const folder = path.length > 1 ? path[0] : 'Папка';
                document.getElementById('folderPath').textContent = `📁 ${folder} (${files.length} файлов)`;

                await autoLoadFiles(files);
            };
            input.click();
        }

        function loadSingleReport() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.xls';
            input.multiple = true;
            input.onchange = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                document.getElementById('folderPath').textContent = `📁 Загружено ${files.length} файлов`;
                await autoLoadFiles(files);
            };
            input.click();
        }

        function loadExcelFileFromFile(file, reportName, targetArray) {
            return new Promise((resolve) => {
                if (file.name.startsWith('~$')) { resolve(false); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = e.target.result;
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rawData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
                        if (!rawData || rawData.length < 2) { resolve(false); return; }

                        // Пытаемся найти строку заголовков: ищем среди первых 10 строк ту, где есть "Артикул"
                        let headerRowIdx = -1;
                        for (let i = 0; i < Math.min(10, rawData.length); i++) {
                            const row = rawData[i] || [];
                            const hasArticle = row.some(cell => String(cell || '').trim().toLowerCase() === 'артикул');
                            if (hasArticle) {
                                headerRowIdx = i;
                                break;
                            }
                        }
                        if (headerRowIdx === -1) headerRowIdx = 2; // fallback

                        const headers = (rawData[headerRowIdx] || []).map(h => String(h || '').trim());

                        const jsonData = [];
                        for (let i = headerRowIdx + 1; i < rawData.length; i++) {
                            const row = rawData[i];
                            if (!row || row.length === 0) continue;
                            const obj = {};
                            for (let j = 0; j < headers.length; j++) {
                                const header = headers[j];
                                if (header && header !== '' && !header.startsWith('__EMPTY')) {
                                    let val = row[j] !== undefined && row[j] !== '' ? row[j] : '';
                                    if (typeof val === 'string') val = val.trim();
                                    obj[header] = val;
                                }
                            }
                            if (Object.keys(obj).length > 0) jsonData.push(obj);
                        }
                        targetArray.length = 0;
                        targetArray.push(...jsonData);
                        loadedReports[reportName] = true;
                        resolve(true);
                    } catch (err) {
                        console.error(err);
                        loadedReports[reportName] = false;
                        resolve(false);
                    }
                };
                reader.onerror = () => resolve(false);
                reader.readAsArrayBuffer(file);
            });
        }

        async function autoLoadFiles(files) {
            const resultContainer = document.getElementById('autoLoadResultContainer');
            const resultDiv = document.getElementById('autoLoadResult');

            resultContainer.style.display = 'block';
            resultDiv.innerHTML = '';
            resultDiv.classList.remove('collapsed');

            // Сбрасываем загрузку
            reportNames.forEach(n => loadedReports[n] = false);
            gammaData = [];
            reservyData = [];

            const loadedFiles = {};
            let loadedCount = 0;

            for (const file of files) {
                const name = file.name.toLowerCase();
                let found = false;
                for (const [report, patterns] of Object.entries(reportFilePatterns)) {
                    if (loadedReports[report]) continue;
                    for (const p of patterns) {
                        if (name.includes(p.toLowerCase())) {
                            let targetArray;
                            switch (report) {
                                case 'Гамма':
                                    targetArray = gammaData;
                                    break;
                                case 'Резервы':
                                    targetArray = reservyData;
                                    break;
                                default:
                                    continue;
                            }
                            const ok = await loadExcelFileFromFile(file, report, targetArray);
                            if (ok) {
                                loadedCount++;
                                loadedReports[report] = true;
                                loadedFiles[report] = file.name;
                            }
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }
            }

            // Формируем результат
            let resultHtml = '';
            for (const report of reportNames) {
                const status = loadedReports[report] ? '✅' : '❌';
                const fileName = loadedFiles[report] || 'не найден';
                const statusClass = loadedReports[report] ? 'status-ok' : 'status-fail';
                const copyable = loadedReports[report] ?
                    `<span class="copyable" onclick="copyToClipboard('${fileName}')" title="Кликните чтобы скопировать">${fileName} 📋</span>` :
                    fileName;
                resultHtml +=
                    `<div class="result-item"><span class="${statusClass}">${status}</span> <strong>${report}</strong>: ${copyable}</div>`;
            }
            resultHtml +=
                `<div style="margin-top:6px;font-weight:700;color:#2e7d32;">✅ Загружено ${loadedCount} из ${reportNames.length} отчётов</div>`;

            resultDiv.innerHTML = resultHtml;

            document.getElementById('loadedCount').textContent = loadedCount;
            document.getElementById('statusMessage').textContent = loadedCount > 0 ? '✅ Загружено' : '❌ Ошибка';

            if (gammaData.length) {
                showToast(`✅ Загружено ${loadedCount} отчётов. Нажмите "ВЫЧИСЛИТЬ"`, 'success');
            } else {
                showToast('⚠️ Файл "Гамма" не найден', 'warning');
            }
        }

        // ---- Copy to clipboard ----
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`📋 Скопировано: ${text}`, 'success', 1500);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            textArea.style.top = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`📋 Скопировано: ${text}`, 'success', 1500);
            } catch (err) {
                showToast(`❌ Не удалось скопировать: ${text}`, 'error');
            }
            document.body.removeChild(textArea);
        }

        document.addEventListener('DOMContentLoaded', function() {
            try {
                const saved = localStorage.getItem('ts_stores');
                if (saved) {
                    const arr = JSON.parse(saved);
                    if (Array.isArray(arr)) tsSelectedStores = new Set(arr);
                }
            } catch (e) {}

            const origApply = applyTsFilter;
            applyTsFilter = function() {
                origApply();
                try {
                    localStorage.setItem('ts_stores', JSON.stringify(Array.from(tsSelectedStores)));
                } catch (e) {}
            };

            const origReset = resetTsFilter;
            resetTsFilter = function() {
                origReset();
                try {
                    localStorage.setItem('ts_stores', JSON.stringify([]));
                } catch (e) {}
            };

            console.log('📊 ТС Аналитика v2.2');
            console.log('💡 Загрузите отчёты "Гамма" и "Резервы", затем нажмите "ВЫЧИСЛИТЬ"');
        });
